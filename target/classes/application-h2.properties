# Local file database - data is kept in the ./data folder next to where you run the app
spring.datasource.url=jdbc:h2:file:./data/expensedb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
# Optional DB viewer at http://localhost:8080/h2-console is disabled for security
spring.h2.console.enabled=false