# Aiven MySQL (values come from environment variables)
spring.datasource.url=jdbc:mysql://${DB_HOST:mysql-1e3c2452-saisidhardha.l.aivencloud.com}:${DB_PORT:28587}/${DB_NAME:defaultdb}?ssl-mode=REQUIRED
spring.datasource.username=${DB_USER:avnadmin}
spring.datasource.password=${DB_PASSWORD}

server.port=${PORT:8080}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# IMPORTANT: always set APP_JWT_SECRET on Render; the fallback below is for local use only
app.jwt.secret=${APP_JWT_SECRET:change-this-secret-to-a-long-random-string-1234567890}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

app.currency-symbol=${APP_CURRENCY_SYMBOL:\u20B9}